services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: grocery
      POSTGRES_PASSWORD: grocery
      POSTGRES_DB: grocerycompare
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - grocery_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grocery -d grocerycompare"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  grocery_data:
