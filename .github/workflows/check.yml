name: Checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://grocery:grocery@localhost:5432/grocerycompare
      NODE_ENV: test
    services:
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: grocery
          POSTGRES_PASSWORD: grocery
          POSTGRES_DB: grocerycompare
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U grocery -d grocerycompare"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run prisma:generate --workspace @grocerycompare/api
      - run: npm run db:migrate --workspace @grocerycompare/api
      - run: npm run db:seed --workspace @grocerycompare/api
      - run: npm run check
      - run: npm run test:integration
      - run: npm run test:redis --workspace @grocerycompare/api
        env:
          REDIS_URL: redis://localhost:6379/9
